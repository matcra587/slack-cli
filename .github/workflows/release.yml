name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    permissions:
      contents: write           # Required to create GitHub releases and upload assets.
      id-token: write           # Required for cosign via OIDC.
      actions: read             # Required to inspect CI for the tagged commit.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # clover: provider=github repository=jdx/mise constraint=major
          version: '2026.11.9'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      - name: Check release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "release ${TAG_NAME} already exists; skipping GoReleaser publish"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Await CI gate for tagged commit
        if: steps.release-state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: mise -E development run await-ci

      - name: Check GoReleaser configuration
        if: steps.release-state.outputs.exists != 'true'
        run: mise run release:check

      - name: Run GoReleaser
        if: steps.release-state.outputs.exists != 'true'
        run: mise exec -- goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release checksums
        if: steps.release-state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --dir dist \
            --clobber

      # GitHub artifact attestations are not available for user-owned private repositories.
      # Re-enable this if the repository becomes public or GitHub supports this repository type.
      # - name: Attest release artifact provenance
      #   if: steps.release-state.outputs.exists != 'true'
      #   uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
      #   with:
      #     subject-checksums: dist/checksums.txt

      - name: Create Homebrew tap token
        id: app-token
        # @clover: constraint=major tags=create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write # Formula push only; blanket app perms otherwise.

      - name: Publish Homebrew formula
        # @clover: constraint=major tag-prefix=homebrew/ tags=actions
        uses: matcra587/github-actions/packages/homebrew-publish-formula@3b7e5c01d5ae0ccb2aeedf023c69d34b86cf2476 # homebrew/v0.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tap: matcra587/homebrew-tap
          name: slick
          desc: Headless Slack CLI for agents, scripts, and CI jobs
          homepage: https://github.com/matcra587/slack-cli
          version: ${{ github.ref_name }}
          binary-name: slick
          module-path: github.com/matcra587/slack-cli
          build-package: ./cmd/slick
          commit-message: "slick: v{version}"
