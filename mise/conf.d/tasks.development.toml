#:schema https://mise.jdx.dev/schema/mise.json

[tasks.default]
description = "List available tasks"
quiet = true
run = "mise tasks"

[tasks.check]
description = "Run local verification checks"
depends = [
  "fmt:check",
  "lint",
  "rumdl",
  "shell:check",
  "mise:check",
  "test:workflows",
  "vet",
  "test",
]

[tasks.ci]
description = "Run CI-equivalent checks"
depends = ["check", "security"]

[tasks.fix]
description = "Apply automatic formatting and lint fixes"
run = [{ task = "fmt" }, { task = "lint:fix" }, { task = "rumdl:fix" }]

[tasks."release:check"]
description = "Run GoReleaser config and environment checks"
run = ["goreleaser check", "goreleaser healthcheck"]

[tasks."release:build"]
description = "Build binaries with GoReleaser without publishing"
lock = "{{ config_root }}/dist"
run = "goreleaser build --snapshot --clean"

[tasks."release:snapshot"]
description = "Build a full snapshot release locally"
lock = "{{ config_root }}/dist"
run = "goreleaser release --snapshot --clean"

[tasks.test]
description = "Run tests with coverage"
alias = "t"
run = "go test -v -cover ./..."

[tasks."test:all"]
description = "Run all tests without cache"
run = "go test -count=1 ./..."

[tasks."test:race"]
description = "Run tests with race detection"
env = { CGO_ENABLED = "1" }
run = "go test -v -race -cover ./..."

[tasks."test:integration"]
description = "Run integration tests"
run = "go test -v -tags=integration ./tests/integration -count=1 -timeout 300s"

[tasks."test:workflows"]
description = "Test release CI gates without GitHub access"
run = "bash tests/workflows/await-ci.sh"

[tasks."test:live"]
description = "Run explicitly approved isolated Slack fixtures with identity checks and exact cleanup (no everyday defaults)"
depends = ["build"]
run = "go test -v -tags=live ./tests/live -count=1 -timeout 12m"

[tasks.fmt]
description = "Format code with gofmt and gofumpt"
run = ["go fmt ./...", "go tool gofumpt -w ."]

[tasks."fmt:check"]
description = "Check Go formatting"
run = 'formatted_files=$(go tool gofumpt -l .) && test -z "$formatted_files"'

[tasks."fmt:file"]
description = "Format Go file(s) with gofumpt"
raw_args = true
run = "go tool gofumpt -w"

[tasks.lint]
description = "Run golangci-lint"
run = "go tool golangci-lint run"

[tasks."lint:fix"]
description = "Run golangci-lint with auto-fix"
run = "go tool golangci-lint run --fix"

[tasks.rumdl]
description = "Lint markdown files with rumdl"
run = "rumdl check ."

[tasks."rumdl:fix"]
description = "Fix markdown files with rumdl"
raw_args = true
run = "rumdl fmt ."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.security]
description = "Run govulncheck"
run = "go tool govulncheck ./..."

[tasks."shell:check"]
description = "Check shell scripts and sourced helpers with ShellCheck"
run = "shellcheck -x docs/install.sh mise/lib/*.sh mise/tasks/* tests/workflows/*.sh"

[tasks."mise:check"]
description = "Check mise formatting and task definitions in both environments"
run = [
  "mise fmt --check",
  "mise -E production fmt --check",
  "mise tasks validate",
  "mise -E production tasks validate",
]

[tasks.pre-commit]
description = "Run hk pre-commit hook"
run = "hk run pre-commit"

[tasks.deps]
description = "Download Go module dependencies"
run = "go mod download"

[tasks."deps:update"]
description = "Update direct Go dependencies to latest patch releases"
env = { DEPS_UPDATE_QUERY = "patch" }
file = "mise/lib/deps-update.sh"

[tasks."deps:update:minor"]
description = "Update direct Go dependencies to latest minor and patch releases"
env = { DEPS_UPDATE_QUERY = "latest" }
file = "mise/lib/deps-update.sh"

[tasks.tidy]
description = "Tidy Go modules and verify no drift"
run = ["go mod tidy", "git diff --exit-code -- go.mod go.sum"]

[tasks.generate]
description = "Run go generate"
run = "go generate ./..."

[tasks.clean]
description = "Remove build and coverage outputs"
lock = "{{ config_root }}/dist"
run = "rm -rf bin dist coverage.out"

[tasks."docs:serve"]
description = "Serve the documentation site with live reload"
raw_args = true
run = "uvx --python 3.15 --from zensical==0.1.1 zensical serve -f zensical.toml --dev-addr 127.0.0.1:4000"

[tasks."docs:build"]
description = "Build the documentation site with strict validation"
run = "uvx --python 3.15 --from zensical==0.1.1 zensical build --clean --strict -f zensical.toml"
